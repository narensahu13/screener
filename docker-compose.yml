services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
      DATA_SOURCE: mock
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
